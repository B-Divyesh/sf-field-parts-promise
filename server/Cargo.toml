[package]
name = "parts-promise-api"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8.4"
chrono = { version = "0.4.42", features = ["serde"] }
jsonwebtoken = "9.3.1"
rand = "0.9.2"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "any", "postgres", "sqlite", "migrate", "macros", "chrono", "uuid"] }
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
tower-http = { version = "0.6.6", features = ["cors", "fs", "request-id", "trace"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1.3"
serde_json = "1.0.143"
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }
